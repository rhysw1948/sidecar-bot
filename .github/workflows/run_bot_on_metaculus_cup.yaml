name: Forecast on Metaculus Cup

on:
  workflow_dispatch:
  # Sidecar-bot: schedule removed (was cron "0 0 */2 * *"). Run by hand only.

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          uv run python main.py --mode metaculus_cup
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      # Sidecar-bot: keep a private record of every raw forecast.
      # The plain log is encrypted with the public key in this repo, then
      # deleted. Only the encrypted .gpg file is uploaded (artifacts on a
      # public repo can be downloaded by any signed-in GitHub user).
      - name: Encrypt forecast log
        if: always()
        run: |
          gpg --version | head -n 1
          if [ -f forecast_log.jsonl ]; then
            echo "forecast_log.jsonl lines: $(wc -l < forecast_log.jsonl)"
            gpg --batch --yes --trust-model always \
              --recipient-file forecast_log_pubkey.asc \
              --output forecast_log.jsonl.gpg --encrypt forecast_log.jsonl
            rm -f forecast_log.jsonl
          else
            echo "No forecast_log.jsonl this run (no questions forecast)."
          fi
          ls -la forecast_log* 2>/dev/null || true
      - name: Upload encrypted forecast log (.gpg only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-log-${{ github.run_id }}
          path: forecast_log.jsonl.gpg
          retention-days: 90
          if-no-files-found: ignore
